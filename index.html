<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>VoiceDumps</title>
    <script>
      // Inline and blocking on purpose. The theme has to be on <html> before the
      // first paint — run this from the bundle instead and a dark-mode user gets
      // a white flash on every launch. Kept in sync with src/lib/theme.ts.
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("voicedumps:theme") === "dark") theme = "dark";
        } catch (e) {
          /* storage unavailable — paper it is */
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
