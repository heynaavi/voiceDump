[package]
name = "voicedumps"
version = "0.5.0"
description = "Local speech to text for macOS"
authors = ["Naveen"]
edition = "2021"

[lib]
name = "voicedumps_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# Insights buckets notes by local calendar day, and std has no timezone. Doing
# it in UTC would slide every evening dictation onto tomorrow for anyone west of
# London and quietly break the streak count.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }
symphonia = { version = "0.5", features = ["aac", "alac", "isomp4", "mp3"] }
tauri-plugin-autostart = "2.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
# The globe/fn key is a modifier, not a keycode, so it can't be registered as a
# normal global shortcut — it only shows up as a flagsChanged event. That means
# a CGEventTap, which is also what synthesises the paste keystroke.
core-graphics = "0.24"
core-foundation = "0.10"
# Tauri's always-on-top maps to NSFloatingWindowLevel, which isn't high enough
# for a HUD that must sit over fullscreen apps. Reaching the NSWindow directly
# is the only way to set the level and collection behaviour we need.
objc2 = "0.6"
# Native CoreAudio capture for globe-key dictation. ffmpeg's avfoundation input
# pays a ~2s AVCaptureSession warm-up on every open, which silently clips (or
# eats entirely) short dictations; an in-process cpal stream opens in tens of
# milliseconds. hound writes the WAV the engine then transcribes.
cpal = "0.15"
hound = "3.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
